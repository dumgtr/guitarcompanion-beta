<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tone.js Sampler Spike (Isolated)</title>
    <!-- Load Tone.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --bg: #121212;
            --text: #e0e0e0;
            --accent: #bb86fc;
            --error: #cf6679;
            --surface: #1e1e1e;
            --surface-hover: #2c2c2c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: var(--accent);
            text-align: center;
        }
        .warning {
            color: #ffb74d;
            font-size: 0.9em;
            margin-bottom: 20px;
            text-align: center;
        }
        .status-panel {
            background-color: var(--surface);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .status-row:last-child {
            margin-bottom: 0;
        }
        .status-label {
            color: #888;
        }
        .status-value {
            font-weight: bold;
        }
        #error-msg {
            color: var(--error);
            font-size: 0.9em;
            margin-top: 10px;
            display: none;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }
        button {
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid #444;
            border-radius: 6px;
            padding: 12px 16px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: var(--surface-hover);
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .stop-btn {
            background-color: #331515;
            border-color: var(--error);
            color: var(--error);
            margin-top: 10px;
        }
        
        /* Mobile Audio Unlock Overlay */
        #unlock-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #unlock-btn {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 15px 30px;
            border: none;
        }
        #unlock-btn:hover {
            background-color: #d1a3ff;
        }
    </style>
</head>
<body>

    <div id="unlock-overlay">
        <h2 style="color: white; margin-bottom: 20px;">Audio Context Locked</h2>
        <p style="color: #ccc; margin-bottom: 30px; text-align: center; max-width: 300px;">
            Browsers require interaction to start audio. Tap the button below to begin.
        </p>
        <button id="unlock-btn">Unlock Audio</button>
    </div>

    <h1>Tone.js Sampler Spike</h1>
    <div class="warning">EXPERIMENT ONLY - Isolated from production app</div>

    <div class="status-panel">
        <div class="status-row">
            <span class="status-label">Context State:</span>
            <span class="status-value" id="status-state">Locked</span>
        </div>
        <div class="status-row">
            <span class="status-label">Engine Ready:</span>
            <span class="status-value" id="status-engine">Loading samples...</span>
        </div>
        <div class="status-row">
            <span class="status-label">Now Playing:</span>
            <span class="status-value" id="status-playing" style="color: var(--accent);">--</span>
        </div>
        <div id="error-msg"></div>
    </div>

    <div class="controls" id="main-controls" style="opacity: 0.5; pointer-events: none;">
        <button onclick="playNote('C4')">Play C4 (Root)</button>
        <button onclick="playNote('E4')">Play E4 (Major 3rd)</button>
        <button onclick="playNote('A4')">Play A4</button>
        <hr style="width: 100%; border-color: #333; margin: 10px 0;">
        <button onclick="playCompare(['A2', 'C4'], 'A Minor Feel')">Compare: A2 + C4 (Minor feel)</button>
        <button onclick="playCompare(['A2', 'C#4'], 'A Major Feel')">Compare: A2 + C#4 (Major feel)</button>
        <button class="stop-btn" onclick="stopAudio()">Stop / Release</button>
    </div>

    <script>
        const stateEl = document.getElementById('status-state');
        const engineEl = document.getElementById('status-engine');
        const playingEl = document.getElementById('status-playing');
        const errorEl = document.getElementById('error-msg');
        const overlay = document.getElementById('unlock-overlay');
        const controls = document.getElementById('main-controls');

        let sampler;
        let isEngineReady = false;
        
        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
            console.error(msg);
        }

        // 1. Setup Tone.js Sampler and effects
        async function initAudioEngine() {
            try {
                // Soft Piano Effects Chain
                const filter = new Tone.Filter(2000, "lowpass");
                const reverb = new Tone.Reverb(2.5); // 2.5s decay
                
                // Wait for reverb to generate impulse response
                await reverb.generate();

                sampler = new Tone.Sampler({
                    urls: {
                        "C4": "C4.mp3",
                        "D#4": "Ds4.mp3",
                        "F#4": "Fs4.mp3",
                        "A4": "A4.mp3",
                    },
                    release: 1.5,
                    baseUrl: "https://tonejs.github.io/audio/salamander/",
                    onload: () => {
                        isEngineReady = true;
                        engineEl.textContent = "Ready (Salamander Grand)";
                        engineEl.style.color = "#81c784";
                        controls.style.opacity = "1";
                        controls.style.pointerEvents = "auto";
                    }
                }).chain(filter, reverb, Tone.Destination);

                // Lower volume slightly for soft piano feel
                sampler.volume.value = -6;
                
            } catch (err) {
                showError("Failed to load sampler: " + err.message);
                engineEl.textContent = "Error";
                engineEl.style.color = "var(--error)";
            }
        }

        // 2. Handle Audio Unlock
        document.getElementById('unlock-btn').addEventListener('click', async () => {
            await Tone.start();
            stateEl.textContent = "Unlocked (Running)";
            stateEl.style.color = "#81c784";
            overlay.style.display = 'none';
            
            // Initialize engine after unlock
            initAudioEngine();
        });

        // 3. Playback functions
        function playNote(note) {
            if (!isEngineReady) return;
            sampler.releaseAll(); // Clean stop before new note
            sampler.triggerAttackRelease(note, "2n");
            playingEl.textContent = note;
        }

        function playCompare(notes, label) {
            if (!isEngineReady) return;
            sampler.releaseAll();
            // Trigger multiple notes as a chord to demonstrate color
            sampler.triggerAttackRelease(notes, "2n");
            playingEl.textContent = label + " (" + notes.join(" + ") + ")";
        }

        function stopAudio() {
            if (!isEngineReady) return;
            sampler.releaseAll();
            playingEl.textContent = "Stopped";
        }
    </script>
</body>
</html>
